<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halo Hybrid!</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: white;
      background: linear-gradient(135deg, #6d28d9, #ec4899 55%, #f59e0b);
    }
    .glow {
      position: fixed;
      width: 340px;
      height: 340px;
      border-radius: 50%;
      background: rgba(255,255,255,.16);
      filter: blur(3px);
      top: -100px;
      right: -80px;
    }
    .card {
      width: min(90vw, 760px);
      padding: clamp(2rem, 7vw, 5rem) 1.5rem;
      text-align: center;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 32px;
      background: rgba(255,255,255,.13);
      box-shadow: 0 24px 80px rgba(50, 10, 80, .28);
      backdrop-filter: blur(12px);
      animation: pop .8s cubic-bezier(.2,.8,.2,1) both;
    }
    .emoji { font-size: clamp(2.5rem, 8vw, 5rem); margin-bottom: 1rem; }
    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 7vw, 5rem);
      line-height: 1.08;
      letter-spacing: -0.04em;
      text-shadow: 0 5px 25px rgba(0,0,0,.18);
    }
    p { margin: 1.2rem 0 0; font-size: clamp(1rem, 2.5vw, 1.3rem); }
    button {
      margin-top: 2rem;
      border: 0;
      border-radius: 999px;
      padding: .9rem 1.4rem;
      font: inherit;
      font-weight: 800;
      color: #6d28d9;
      background: white;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
      box-shadow: 0 8px 24px rgba(0,0,0,.18);
    }
    button:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 12px 30px rgba(0,0,0,.22); }
    #surprise { min-height: 1.5em; font-weight: 700; }
    @keyframes pop { from { opacity: 0; transform: translateY(20px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @media (prefers-reduced-motion: reduce) { .card { animation: none; } }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <main class="card">
    <div class="emoji" aria-hidden="true">😎 🐟 🐈</div>
    <h1>Halo Hybrid keren lohan dan lele!</h1>
    <p>Website paling kece buat hybrid paling unik ✨</p>
    <button type="button" onclick="document.getElementById('surprise').textContent='LOHAN + LELE = HYBRID LEGENDARIS 🔥';">Klik buat kejutan</button>
    <p id="surprise" aria-live="polite"></p>
  </main>
</body>
</html>
